<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <title>Página não encontrada | Dual Essence</title>
  <style>
    :root{--dark:#111;--accent:#c89b3c;--green:#25d366}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:20px;background:#f7f7f7;color:#171717;font-family:Arial,Helvetica,sans-serif}
    .box{width:min(560px,100%);background:#fff;border:1px solid #e7e7e7;border-radius:22px;
      padding:42px 28px;text-align:center;box-shadow:0 12px 40px #00000012}
    .brand{font-weight:800;font-size:22px;letter-spacing:.5px}
    .brand span{color:var(--accent)}
    h1{font-size:64px;margin:25px 0 5px}
    h2{margin:0 0 12px}
    p{color:#666;line-height:1.6}
    .buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}
    a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
      padding:13px 18px;border-radius:10px;font-weight:700}
    .home{background:var(--dark);color:#fff}
    .wa{background:var(--green);color:#fff}
  </style>
</head>
<body>
  <main class="box">
    <div class="brand">DUAL <span>ESSENCE</span></div>
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>A página que procuras pode ter sido movida ou o endereço pode estar incorreto.</p>
    <div class="buttons">
      <a class="home" href="https://www.dualessence.ao/">Voltar à loja</a>
      <a class="wa" href="https://wa.me/244958374723?text=Olá%2C%20Dual%20Essence%21" target="_blank" rel="noopener">Falar no WhatsApp</a>
    </div>
  </main>
</body>
</html>
